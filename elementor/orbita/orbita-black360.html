<style>
/* ------------------------------------------------------------------ base */

.b360-orbita {
  --azul:  #3b9ae8;
  --giro-fora: 90s;      /* volta completa do anel pontilhado */
  --giro-dentro: 34s;    /* volta completa do anel de brilho */

  position: relative;
  background: #0a0a0c;
  overflow: hidden;
  padding: 40px 0;
}

.b360-palco {
  position: relative;
  width: 100%;
  max-width: 1124px;
  margin: 0 auto;
  aspect-ratio: 1124 / 734;
  container-type: inline-size;     /* deixa tudo escalar junto, em cqw */
}

/* ------------------------------------------------------------- luz de fundo */
/* As duas elipses "luz de fundo" do Figma, na posição e no tamanho de lá. */

.b360-cena { position: absolute; inset: 0; }

.b360-luz-a, .b360-luz-b, .b360-luz-c {
  position: absolute; pointer-events: none; z-index: 0;
}

.b360-luz-c {
  left: -12%; top: -14%; width: 124%; height: 128%;
  background: radial-gradient(ellipse 50% 50% at 46.4% 50%,
    rgba(150,186,230,.20)  0%,
    rgba(120,158,208,.11) 32%,
    rgba(110,146,196,.04) 58%,
    transparent           82%);
}

.b360-luz-a {
  left: 15.9%; top: 17.7%; width: 37.9%; height: 42%;
  background: radial-gradient(ellipse 50% 50% at 50% 50%,
    rgba(214,231,250,.60)  0%,
    rgba(150,190,234,.34) 26%,
    rgba(130,172,220,.14) 50%,
    rgba(130,172,220,.04) 74%,
    transparent          100%);
}

.b360-luz-b {
  left: 14.2%; top: 19.7%; width: 64.3%; height: 61.3%;
  background: radial-gradient(ellipse 50% 50% at 50% 50%,
    rgba(186,214,244,.44)  0%,
    rgba(124,168,218,.26) 30%,
    rgba(110,152,204,.11) 56%,
    rgba(110,152,204,.03) 78%,
    transparent          100%);
}

/* imagem do container de trás — só aparece quando você põe a URL */
.b360-traseira {
  position: absolute;
  left: 50%; top: 50%;
  width: 118%; height: 118%;
  transform: translate(-50%, -50%);
  background: no-repeat center / contain;
  opacity: .9;
  pointer-events: none;
  z-index: 0;
}

/* ----------------------------------------------------------------- anéis */

.b360-aneis {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  z-index: 1;
  overflow: visible;
}

/* o giro precisa acontecer em volta do centro da órbita (522 / 367 do
   viewBox), não do canto do SVG */
.b360-gira {
  transform-box: view-box;
  transform-origin: 522px 367px;
  animation: b360-gira linear infinite;
}

.b360-gira--fora   { animation-duration: var(--giro-fora); }
.b360-gira--dentro { animation-duration: var(--giro-dentro); animation-direction: reverse; }

@keyframes b360-gira { to { transform: rotate(360deg); } }

/* ---------------------------------------------------------------- esfera */

.b360-nucleo {
  position: absolute;
  left: 46.43%; top: 49.27%;          /* centro da órbita, medido no Figma */
  width: 23.04%;                       /* 259 de 1124 */
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  z-index: 2;
}

.b360-nucleo img {
  width: 100%; height: 100%;
  display: block;
  border-radius: 50%;
  filter: drop-shadow(0 0 40px rgba(90,150,220,.35));
}

.b360-nucleo:empty, .b360-nucleo img:not([src]) { display: none; }

/* ----------------------------------------------------------------- boxes */

.b360-cartoes {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

.b360-orbita > .b360-cartoes {                 /* sobrepõe o palco */
  position: absolute;
  left: 50%; top: 40px;
  width: 100%; max-width: 1124px;
  height: calc(100% - 80px);
  transform: translateX(-50%);
  container-type: inline-size;
}

.b360-cartao {
  position: absolute;
  left: var(--x); top: var(--y); width: var(--w);
  box-sizing: border-box;
  padding: 2.3cqw 2.7cqw;
  border-radius: 1.25cqw;
  border: 1px solid rgba(255,255,255,.09);
  background:
    linear-gradient(150deg, rgba(255,255,255,.055), rgba(255,255,255,.012) 60%),
    rgba(10,12,16,.62);
  -webkit-backdrop-filter: blur(6px);
          backdrop-filter: blur(6px);
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
  pointer-events: auto;
}

.b360-cartao b {
  display: block;
  color: var(--azul);
  font-size: 1.07cqw;
  font-weight: 700;
  letter-spacing: .12em;
  margin-bottom: .9cqw;
}

.b360-cartao h3 {
  margin: 0 0 .7cqw;
  color: #fff;
  font-size: 1.72cqw;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -.01em;
  text-wrap: balance;
}

.b360-cartao p {
  margin: 0;
  color: rgba(255,255,255,.55);
  font-size: 1.16cqw;
  font-weight: 400;
  line-height: 1.4;
}

.b360-orbita, .b360-cartao {
  font-family: "Cutta", "Gotham", "Archivo", system-ui, -apple-system, sans-serif;
}

/* ------------------------------------------------------------- responsivo */
/* Abaixo de 900px a órbita não comporta os boxes em volta: a órbita fica em
   cima e os quatro boxes viram uma lista. */

@media (max-width: 900px) {
  .b360-orbita { padding: 32px 16px; }

  /* o palco vira quadrado para a órbita não ficar espremida; a cena inteira
     (luzes, anéis e esfera) é ampliada junto, para as proporções do Figma
     não se perderem */
  .b360-palco { max-width: 460px; aspect-ratio: 1; }
  .b360-cena  { transform: scale(1.34); }

  .b360-orbita > .b360-cartoes {
    position: static;
    transform: none;
    height: auto;
    max-width: 460px;
    margin: 24px auto 0;
    display: grid;
    gap: 12px;
    container-type: normal;
  }

  .b360-cartao {
    position: static;
    width: auto;
    padding: 16px 18px;
    border-radius: 14px;
  }

  .b360-cartao b  { font-size: 11px; margin-bottom: 8px; }
  .b360-cartao h3 { font-size: 17px; margin-bottom: 5px; }
  .b360-cartao p  { font-size: 13px; }
}

@media (prefers-reduced-motion: reduce) {
  .b360-gira { animation: none; }
}
</style>
