<style>
.b360-zap {
  --zap-verde: #25d366;
  --zap-tamanho: 60px;
  --zap-margem: 22px;

  position: fixed;
  right: var(--zap-margem);
  bottom: max(var(--zap-margem), env(safe-area-inset-bottom, 0px));
  z-index: 2147483000;          /* acima de pop-ups e barras de cookie */

  display: flex;
  align-items: center;
  gap: 10px;

  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}

.b360-zap-icone {
  position: relative;
  width: var(--zap-tamanho);
  height: var(--zap-tamanho);
  flex: 0 0 auto;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;
  background: var(--zap-verde);
  color: #fff;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .28), 0 2px 6px rgba(0, 0, 0, .18);
  transition: transform .25s cubic-bezier(.22, .8, .3, 1), box-shadow .25s ease;
}

/* onda que sai de trás do botão, para o olho achar o ícone */
.b360-zap-icone::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--zap-verde);
  z-index: -1;
  animation: b360-zap-onda 2.4s ease-out infinite;
}

@keyframes b360-zap-onda {
  0%        { transform: scale(1);   opacity: .55; }
  70%, 100% { transform: scale(1.9); opacity: 0;   }
}

.b360-zap:hover .b360-zap-icone,
.b360-zap:focus-visible .b360-zap-icone {
  transform: scale(1.07);
  box-shadow: 0 10px 26px rgba(0, 0, 0, .34), 0 2px 8px rgba(0, 0, 0, .2);
}

.b360-zap:focus-visible .b360-zap-icone {
  outline: 3px solid #fff;
  outline-offset: 3px;
}

.b360-zap:active .b360-zap-icone { transform: scale(.96); }

/* balãozinho que aparece no hover */
.b360-zap-balao {
  order: -1;                     /* fica à esquerda do ícone */
  white-space: nowrap;
  padding: 9px 14px;
  border-radius: 10px;
  background: #fff;
  color: #14181d;
  font: 600 14px/1 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .22);

  opacity: 0;
  transform: translateX(8px);
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}

.b360-zap:hover .b360-zap-balao,
.b360-zap:focus-visible .b360-zap-balao {
  opacity: 1;
  transform: translateX(0);
}

/* entrada: o botão só aparece depois de um instante, para não competir
   com o carregamento da página */
.b360-zap {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity .4s ease, transform .4s ease;
}
.b360-zap.b360-zap--visivel { opacity: 1; transform: none; }

@media (max-width: 767px) {
  .b360-zap { --zap-tamanho: 54px; --zap-margem: 16px; }
  .b360-zap-balao { display: none; }   /* no celular não existe hover */
}

@media (prefers-reduced-motion: reduce) {
  .b360-zap, .b360-zap-icone { transition: none; }
  .b360-zap-icone::before { animation: none; }
}

@media print { .b360-zap { display: none; } }
</style>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------- ajustes */

  var NUMERO = "5511922264029";                       /* só dígitos, com o 55 */
  var MENSAGEM = "Quero mais informações da Black";
  var ATRASO = 900;                                   /* ms até o botão surgir */

  var el = document.getElementById("b360-zap");
  if (!el) return;

  /* Monta o link aqui também, para a mensagem poder ser editada em texto
     normal, sem precisar acertar a codificação da URL na mão. */
  el.href = "https://wa.me/" + NUMERO + "?text=" + encodeURIComponent(MENSAGEM);

  setTimeout(function () { el.classList.add("b360-zap--visivel"); }, ATRASO);
})();
</script>
